strictPeerDependencies: true
autoInstallPeers: true
shamefullyHoist: true

# These exact versions were selected by the explicit latest-version upgrade
# before pnpm 11's one-day quarantine elapsed. Future releases remain protected.
minimumReleaseAgeExclude:
  - '@netlify/build@36.2.4'
  - '@netlify/cache-utils@7.1.1'
  - '@netlify/edge-bundler@16.0.1'
  - '@netlify/functions-utils@7.1.1'
  - '@netlify/serverless-functions-api@2.18.0'
  - '@netlify/zip-it-and-ship-it@15.3.1'
  - '@octokit/endpoint@11.0.4'
  - '@oxlint/binding-android-arm-eabi@1.77.0'
  - '@oxlint/binding-android-arm64@1.77.0'
  - '@oxlint/binding-darwin-arm64@1.77.0'
  - '@oxlint/binding-darwin-x64@1.77.0'
  - '@oxlint/binding-freebsd-x64@1.77.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.77.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.77.0'
  - '@oxlint/binding-linux-arm64-gnu@1.77.0'
  - '@oxlint/binding-linux-arm64-musl@1.77.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.77.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.77.0'
  - '@oxlint/binding-linux-riscv64-musl@1.77.0'
  - '@oxlint/binding-linux-s390x-gnu@1.77.0'
  - '@oxlint/binding-linux-x64-gnu@1.77.0'
  - '@oxlint/binding-linux-x64-musl@1.77.0'
  - '@oxlint/binding-openharmony-arm64@1.77.0'
  - '@oxlint/binding-win32-arm64-msvc@1.77.0'
  - '@oxlint/binding-win32-ia32-msvc@1.77.0'
  - '@oxlint/binding-win32-x64-msvc@1.77.0'
  - '@rolldown/binding-android-arm64@1.2.2'
  - '@rolldown/binding-darwin-arm64@1.2.2'
  - '@rolldown/binding-darwin-x64@1.2.2'
  - '@rolldown/binding-freebsd-x64@1.2.2'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.2'
  - '@rolldown/binding-linux-arm64-gnu@1.2.2'
  - '@rolldown/binding-linux-arm64-musl@1.2.2'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.2'
  - '@rolldown/binding-linux-s390x-gnu@1.2.2'
  - '@rolldown/binding-linux-x64-gnu@1.2.2'
  - '@rolldown/binding-linux-x64-musl@1.2.2'
  - '@rolldown/binding-openharmony-arm64@1.2.2'
  - '@rolldown/binding-win32-arm64-msvc@1.2.2'
  - '@rolldown/binding-win32-x64-msvc@1.2.2'
  - '@typescript-eslint/project-service@8.66.0'
  - '@typescript-eslint/tsconfig-utils@8.66.0'
  - '@typescript-eslint/types@8.66.0'
  - '@typescript-eslint/typescript-estree@8.66.0'
  - '@typescript-eslint/visitor-keys@8.66.0'
  - 'bare-fs@4.8.0'
  - 'bare-url@2.4.7'
  - 'baseline-browser-mapping@2.11.12'
  - 'fastify@5.11.2'
  - 'nanoid@3.3.17'
  - 'netlify-cli@27.0.2'
  - 'oxlint@1.77.0'
  - 'rolldown@1.2.2'

# These dependencies need lifecycle scripts for native binaries or CLI setup.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  netlify-cli: true
  sharp: true
  unix-dgram: true

overrides:
  # Netlify's ipx range is still pinned to the vulnerable sharp 0.34 line.
  'ipx@3.1.1>sharp': 0.35.3

peerDependencyRules:
  allowedVersions:
    '@opentelemetry/api': '1.9.1'
    typescript: '6'
