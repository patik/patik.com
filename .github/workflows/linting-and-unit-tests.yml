name: Linting and Tests

on:
  push:
  pull_request:
    types: [opened, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    # Must stay the image scripts/visual.sh uses: bare ubuntu-latest resolves `monospace`
    # to a different face, a ~2% pixel diff against a 0.2% threshold.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    env:
      PLAYWRIGHT_IMAGE_VERSION: "1.62.1"

    strategy:
      matrix:
        node-version: [26.3.0]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install

      # Browsers ship with the image, but only the build matching its tag. Fail here with
      # the reason rather than downstream with a wall of pixel diffs.
      - name: Verify the container matches the installed Playwright
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but this job runs in the v$PLAYWRIGHT_IMAGE_VERSION container. Bump the container tag and PLAYWRIGHT_IMAGE_VERSION in .github/workflows/*.yml — visual baselines are only comparable within one image."
            exit 1
          fi

      - name: Build
        run: pnpm build
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # When visual tests fail because Linux baselines don't exist yet, Playwright writes
      # them to tests-snapshots/ before exiting. Upload that directory so you can download
      # the PNGs, commit them, and the next CI run will pass.
      - name: Upload new snapshots (if visual tests wrote baselines)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: new-snapshots
          path: tests-snapshots/
          retention-days: 7
