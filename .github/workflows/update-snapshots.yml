name: Update visual snapshots

# Run manually from the Actions tab when you've made intentional UI changes
# and need to regenerate the Linux baselines.
on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to push the updated snapshot commit

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch the workflow was triggered from
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Build
        run: pnpm build
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Regenerate snapshots
        run: pnpm test:update-snapshots

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests-snapshots/
          git diff --staged --quiet && echo "No snapshot changes." || \
            git commit -m "Update visual regression snapshots [CI]" && git push
