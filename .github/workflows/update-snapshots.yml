name: Update visual snapshots

# Run manually from the Actions tab when you've made intentional UI changes
# and need to regenerate the Linux baselines.
on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    # Must match linting-and-unit-tests.yml and scripts/visual.sh.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    env:
      PLAYWRIGHT_IMAGE_VERSION: "1.62.1"

    permissions:
      contents: write  # needed to push the updated snapshot commit

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch the workflow was triggered from
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
          cache: "pnpm"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install

      # See linting-and-unit-tests.yml.
      - name: Verify the container matches the installed Playwright
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but this job runs in the v$PLAYWRIGHT_IMAGE_VERSION container. Bump the container tag and PLAYWRIGHT_IMAGE_VERSION in .github/workflows/*.yml — visual baselines are only comparable within one image."
            exit 1
          fi

      - name: Build
        run: pnpm build
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Regenerate snapshots
        run: pnpm test:update-snapshots

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests-snapshots/
          git diff --staged --quiet && echo "No snapshot changes." || \
            git commit -m "Update visual regression snapshots [CI]" && git push
